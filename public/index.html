<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111514">
<meta name="description" content="Cardlab test card generator.">
<title>Cardlab</title>
<link rel="icon" type="image/svg+xml" href="./icon.svg">
<link rel="stylesheet" href="./styles.css">
<script type="module" src="./app.mjs"></script>
</head>
<body>
<svg class="svg-library" aria-hidden="true"><defs>
<symbol id="i-card" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M3 10h18M7 15h4"/></symbol>
<symbol id="i-copy" viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="13" rx="2"/><path d="M15 4H5a2 2 0 0 0-2 2v10"/></symbol>
<symbol id="i-download" viewBox="0 0 24 24"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4"/></symbol>
<symbol id="i-play" viewBox="0 0 24 24"><path d="m8 5 11 7-11 7Z"/></symbol>
<symbol id="i-pause" viewBox="0 0 24 24"><path d="M8 5v14M16 5v14"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
<symbol id="i-arrow" viewBox="0 0 24 24"><path d="M4 12h16m-6-6 6 6-6 6"/></symbol>
<symbol id="i-spark" viewBox="0 0 24 24"><path d="m12 3 2.5 6.5L21 12l-6.5 2.5L12 21l-2.5-6.5L3 12l6.5-2.5Z"/></symbol>
</defs></svg>
<header class="topbar"><a class="brand" href="./" aria-label="Cardlab"><span class="brand-mark"><svg><use href="#i-card"/></svg></span><span>cardlab<span class="brand-dot">.</span></span></a></header>
<main>
<div class="workspace">
<aside class="settings panel">
<div class="panel-title"><svg><use href="#i-card"/></svg><h2>Settings</h2></div>
<form id="generator" novalidate>
<div class="field"><label for="bin">BIN</label><input id="bin" name="bin" type="text" placeholder="BIN" autocomplete="off" spellcheck="false" maxlength="32" aria-describedby="error"></div>
<div class="field quantity-field"><label for="count">Count</label><div class="quantity-control"><button type="button" id="decrease" aria-label="Decrease count">−</button><input id="count" name="count" type="number" value="10" min="1" max="500" step="1" aria-describedby="error"><button type="button" id="increase" aria-label="Increase count">+</button></div><div class="presets" aria-label="Count presets"><button type="button" data-count="10" class="selected" aria-pressed="true">10</button><button type="button" data-count="25" aria-pressed="false">25</button><button type="button" data-count="50" aria-pressed="false">50</button><button type="button" data-count="100" aria-pressed="false">100</button></div></div>
<p id="error" class="field-error" role="alert" hidden></p>
<button class="primary-button generate-button" id="generate" type="submit"><svg><use href="#i-spark"/></svg>Generate<svg class="end-icon"><use href="#i-arrow"/></svg></button>
</form>
<div class="sample-card" aria-hidden="true"><div class="sample-top"><span>CARDLAB</span></div><div class="chip"><i></i><i></i><i></i></div><div class="sample-number" id="sample-number">••••  ••••  ••••  ••••</div><div class="sample-bottom"><svg><use href="#i-card"/></svg></div></div>
</aside>
<section class="results" aria-label="Results">
<div class="metrics">
<div class="metric"><div class="metric-caption">Total<svg><use href="#i-card"/></svg></div><div class="metric-value" id="total-count">0</div></div>
<div class="metric live"><div class="metric-caption"><span><i></i>Format OK</span></div><div class="metric-value" id="metric-valid">0</div></div>
<div class="metric die"><div class="metric-caption"><span><i></i>Invalid</span></div><div class="metric-value" id="metric-invalid">0</div></div>
<div class="metric unknown"><div class="metric-caption"><span><i></i>Unknown</span></div><div class="metric-value" id="metric-unknown">0</div></div>
</div>
<section class="scanner panel" aria-label="Structural check"><div class="scan-top"><div class="scan-description"><span class="scan-icon"><svg><use href="#i-play"/></svg></span><h2 id="phase">Ready</h2></div><div class="scan-actions"><button id="stripe-test" class="scan-button stripe-button" type="button">Stripe test</button><button id="scan" class="scan-button" aria-label="Check cards" title="Check cards" disabled><svg><use href="#i-play"/></svg><span>Start</span></button></div></div><div class="progress-meta"><span id="processed">0 / 0</span><strong id="percentage">0%</strong></div><div class="progress-track" id="progress" role="progressbar" aria-label="Structural check progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress-fill"></div></div><output id="stripe-result" class="stripe-result" role="status" hidden></output></section>
<section class="data-panel panel"><div class="data-heading"><h2>Cards <span id="table-total">0</span></h2><div class="data-actions"><button class="small-button" id="copy" disabled><svg><use href="#i-copy"/></svg><span>Copy</span></button><button class="icon-button export-button" id="export" disabled aria-label="Download TXT" title="Download TXT"><svg><use href="#i-download"/></svg></button></div></div>
<div class="filter-row"><div class="tabs" role="tablist" aria-label="Filter cards"><button role="tab" aria-selected="true" class="active" data-filter="all">All<span id="all-count">0</span></button><button role="tab" aria-selected="false" tabindex="-1" data-filter="valid">Format OK<span id="valid-count">0</span></button><button role="tab" aria-selected="false" tabindex="-1" data-filter="invalid">Invalid<span id="invalid-count">0</span></button><button role="tab" aria-selected="false" tabindex="-1" data-filter="unknown">Unknown<span id="unknown-count">0</span></button></div><label class="sort-label"><span class="sr-only">Sort cards</span><select id="sort"><option value="status">By status</option><option value="original">Original order</option></select></label></div>
<div class="table-scroll"><table id="table" hidden><thead><tr><th scope="col" class="index-heading">#</th><th scope="col">Card</th><th scope="col">Network</th><th scope="col">Result</th><th scope="col"><span class="sr-only">Copy</span></th></tr></thead><tbody id="rows"></tbody></table><div class="empty-state" id="empty"><div class="empty-visual" aria-hidden="true"><div class="empty-back"></div><div class="empty-front"><svg><use href="#i-card"/></svg><span></span><span></span></div><i>+</i></div></div></div>
</section>
</section>
</div>
</main>
<div class="toast" role="status" id="toast" hidden></div><div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
</body>
</html>
